name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.2.3)
        required: true

permissions:
  contents: read

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out tap
        uses: actions/checkout@v4
        with:
          repository: omihirofumi/homebrew-tap
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Update formula
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          formula_path="tap/Formula/ww.rb"
          tag="${TAG_NAME}"
          version="${tag#v}"
          url="https://github.com/omihirofumi/ww/archive/refs/tags/${tag}.tar.gz"
          sha256="$(curl -sL "${url}" | shasum -a 256 | awk '{print $1}')"

          FORMULA_PATH="${formula_path}" \
          FORMULA_URL="${url}" \
          FORMULA_SHA256="${sha256}" \
          FORMULA_VERSION="${version}" \
          python3 - <<'PY'
          import os
          from pathlib import Path

          formula_path = Path(os.environ["FORMULA_PATH"])
          url = os.environ["FORMULA_URL"]
          sha256 = os.environ["FORMULA_SHA256"]
          version = os.environ["FORMULA_VERSION"]

          lines = formula_path.read_text().splitlines()
          out = []
          saw_url = False
          saw_sha = False
          saw_version = False
          saw_build = False

          for line in lines:
            stripped = line.lstrip()
            indent = line[: len(line) - len(stripped)]

            if stripped.startswith('system "zig", "build"'):
              saw_build = True
              if '-Dversion=' in stripped:
                out.append(line)
              else:
                out.append(f'{indent}{stripped}, "-Dversion=#{{version}}"')
              continue

            if stripped.startswith('url "'):
              out.append(f'{indent}url "{url}"')
              saw_url = True
              continue

            if stripped.startswith('sha256 "'):
              out.append(f'{indent}sha256 "{sha256}"')
              saw_sha = True
              continue

            if stripped.startswith('version "'):
              out.append(f'{indent}version "{version}"')
              saw_version = True
              continue

            out.append(line)

          if saw_url and not saw_sha:
            for idx, line in enumerate(out):
              if line.lstrip().startswith('url "'):
                indent = line[: len(line) - len(line.lstrip())]
                out.insert(idx + 1, f'{indent}sha256 "{sha256}"')
                break

          formula_path.write_text("\n".join(out) + "\n")
          PY

      - name: Commit and push
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd tap

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ww.rb
          git commit -m "ww ${TAG_NAME}"
          git push
